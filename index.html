<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Trend Pulse • Live Market Intelligence</title>
  
  <!-- Social Media Preview Tags (WhatsApp / X / LinkedIn) -->
  <meta property="og:title" content="AI Trend Pulse • Live AI Market Intelligence">
  <meta property="og:description" content="Autonomous macro-trend synthesis generated directly from top AI tech publications.">
  <meta property="og:type" content="website">

  <style>
    :root {
      --bg: #0b0f19;
      --card: #121826;
      --card-hover: #172033;
      --border: #1f293d;
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.25);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 2.5rem 1rem;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
    }
    .container { max-width: 820px; margin: 0 auto; }
    
    /* Top Header Bar */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    h1 { font-size: 2.2rem; margin: 0 0 0.3rem 0; letter-spacing: -0.02em; }
    .subtitle { color: var(--text-muted); margin: 0; font-size: 1rem; }
    
    /* Action Buttons & Badges */
    .actions { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: #1e293b;
      color: var(--text-muted);
      font-size: 0.8rem;
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      border: 1px solid var(--border);
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--success);
    }
    .btn-copy {
      background: #1e293b;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.4rem 0.9rem;
      border-radius: 20px;
      font-size: 0.82rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
    }
    .btn-copy:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    /* Key Takeaway Hero Card */
    .takeaway-card {
      background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%);
      border: 1px solid #3b82f6;
      box-shadow: 0 10px 25px -5px var(--accent-glow);
      padding: 1.6rem;
      border-radius: 16px;
      margin-bottom: 2.5rem;
    }
    .takeaway-badge {
      display: inline-block;
      background: var(--accent);
      color: white;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
    }
    .takeaway-text {
      margin: 0.8rem 0 0 0;
      font-size: 1.15rem;
      font-weight: 500;
      color: #f1f5f9;
      line-height: 1.5;
    }

    /* Trend Cards */
    .section-title {
      font-size: 1.3rem;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .trend-card {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 1.5rem;
      border-radius: 14px;
      margin-bottom: 1.2rem;
      transition: all 0.2s ease;
    }
    .trend-card:hover {
      background: var(--card-hover);
      border-color: #334155;
      transform: translateY(-2px);
    }
    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.6rem;
    }
    .source-tag {
      font-size: 0.75rem;
      font-weight: 600;
      color: #60a5fa;
      background: #1e293b;
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
    }
    .trend-title { margin: 0 0 0.5rem 0; font-size: 1.2rem; font-weight: 600; color: #fff; }
    .trend-explanation { margin: 0; color: var(--text-muted); font-size: 0.95rem; }
    
    footer {
      text-align: center;
      color: #64748b;
      font-size: 0.85rem;
      margin-top: 3.5rem;
      border-top: 1px solid var(--border);
      padding-top: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-bar">
      <div>
        <h1>⚡ AI Trend Pulse</h1>
        <p class="subtitle">Live macro intelligence synthesized from top AI tech portals.</p>
      </div>
      <div class="actions">
        <div class="status-badge">
          <div class="pulse-dot"></div>
          <span id="last-updated">Updating...</span>
        </div>
        <button class="btn-copy" onclick="copyBriefing()">📋 Copy Briefing</button>
      </div>
    </div>

    <div class="takeaway-card">
      <span class="takeaway-badge">EXECUTIVE TAKEAWAY</span>
      <p id="takeaway" class="takeaway-text">Loading intelligence...</p>
    </div>

    <div class="section-title">🔥 Top Macro Trends</div>
    <div id="trends-container">Loading latest analysis...</div>

    <footer>
      Updated automatically every 6 hours via GitHub Actions & Google Gemini 3.8 Flash • Zero Server Cost
    </footer>
  </div>

  <script>
    let cachedData = null;

    // Cache-busting: append timestamp query (?t=...) so updates load instantly
    fetch('data.json?t=' + Date.now())
      .then(res => res.json())
      .then(data => {
        cachedData = data;
        document.getElementById('takeaway').innerText = data.takeaway;
        
        // Show update time
        const updateDate = data.last_updated ? new Date(data.last_updated) : new Date();
        document.getElementById('last-updated').innerText = 'Synced ' + updateDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

        const container = document.getElementById('trends-container');
        container.innerHTML = '';
        data.trends.forEach(t => {
          container.innerHTML += `
            <div class="trend-card">
              <div class="card-meta">
                <span class="source-tag">${t.source || 'Industry Insight'}</span>
              </div>
              <h3 class="trend-title">${t.title}</h3>
              <p class="trend-explanation">${t.explanation}</p>
            </div>
          `;
        });
      })
      .catch(err => {
        document.getElementById('trends-container').innerHTML = '<p>Briefing updating. Please check back shortly!</p>';
      });

    function copyBriefing() {
      if (!cachedData) return;
      let text = `⚡ AI TREND PULSE BRIEFING\n\n💡 TAKEAWAY:\n${cachedData.takeaway}\n\n🔥 TOP TRENDS:\n`;
      cachedData.trends.forEach((t, i) => {
        text += `\n${i + 1}. ${t.title} [${t.source}]\n   ${t.explanation}\n`;
      });
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.querySelector('.btn-copy');
        btn.innerText = '✅ Copied!';
        setTimeout(() => { btn.innerText = '📋 Copy Briefing'; }, 2000);
      });
    }
  </script>
</body>
</html>
