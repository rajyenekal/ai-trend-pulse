<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Trend Pulse</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #131b2e;
      --border: #23304c;
      --accent: #3b82f6;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
    }
    body {
      margin: 0;
      padding: 2rem 1rem;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { font-size: 2.2rem; margin-bottom: 0.2rem; }
    .subtitle { color: var(--text-muted); margin-bottom: 2rem; }
    .takeaway-card {
      background: linear-gradient(135deg, #1e3a8a, #0f172a);
      border: 1px solid var(--accent);
      padding: 1.5rem;
      border-radius: 12px;
      margin-bottom: 2rem;
    }
    .trend-card {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 1.5rem;
      border-radius: 12px;
      margin-bottom: 1.2rem;
    }
    .badge {
      display: inline-block;
      background: #1e293b;
      color: #60a5fa;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      margin-bottom: 0.6rem;
    }
    h3 { margin: 0 0 0.5rem 0; font-size: 1.25rem; }
    p { margin: 0; color: var(--text-muted); line-height: 1.5; }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚡ AI Trend Pulse</h1>
    <p class="subtitle">Live macro trends synthesized from top AI tech portals.</p>

    <div class="takeaway-card">
      <span class="badge" style="background:#2563eb; color:#fff;">KEY TAKEAWAY</span>
      <h3 id="takeaway" style="margin-top:0.4rem;">Loading latest intelligence...</h3>
    </div>

    <h2>🔥 Top Macro Trends Today</h2>
    <div id="trends-container">Loading trends...</div>
  </div>

  <script>
    fetch('data.json')
      .then(res => res.json())
      .then(data => {
        document.getElementById('takeaway').innerText = data.takeaway;
        const container = document.getElementById('trends-container');
        container.innerHTML = '';
        data.trends.forEach(t => {
          container.innerHTML += `
            <div class="trend-card">
              <span class="badge">${t.source || 'Industry Trend'}</span>
              <h3>${t.title}</h3>
              <p>${t.explanation}</p>
            </div>
          `;
        });
      })
      .catch(err => {
        document.getElementById('trends-container').innerHTML = '<p>Briefing updating soon. Check back shortly!</p>';
      });
  </script>
</body>
</html>
