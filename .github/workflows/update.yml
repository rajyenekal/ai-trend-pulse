name: Update AI Trends

on:
  schedule:
    # Run at off-peak minutes (:17 and :47)
    # Avoids GitHub Actions queue congestion at ':00' which causes dropped or delayed cron runs
    - cron: '17,47 * * * *'
  push:
    branches:
      - main
    paths-ignore:
      - 'data.json'
      - 'README.md'
      - 'DATA_PIPELINE.md'
      - '.gitignore'
      - 'favicon.*'
      - 'apple-touch-icon.png'
  workflow_dispatch:
  repository_dispatch:
    types: [hourly-update, external-ping]

concurrency:
  group: update-ai-trends
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install feedparser google-genai

      - name: Run Backend Tracker
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python tracker.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Test Suite
        run: npm test

      - name: Safely Commit and Push data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f data.json ]; then
            git add data.json
            if ! git diff --staged --quiet; then
              git commit -m "Auto-update AI Trends"
              git pull --rebase origin main
              git push
            else
              echo "No new news changes detected in data.json"
            fi
          fi
