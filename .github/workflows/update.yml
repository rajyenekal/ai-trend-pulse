name: Update AI Trends

on:
  schedule:
    - cron: '0 * * * *' # Hourly trigger
  workflow_dispatch:

concurrency:
  group: update-ai-trends
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install feedparser google-genai

      - name: Run Backend Tracker
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python tracker.py

      - name: Safely Commit and Push data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f data.json ]; then
            git add data.json
            if ! git diff --staged --quiet; then
              git commit -m "Auto-update AI Trends"
              git push
            else
              echo "No new news changes detected in data.json"
            fi
          fi
