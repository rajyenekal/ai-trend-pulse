name: Update AI Trends

on:
  schedule:
    # Run at off-peak minutes (:17 and :47)
    # Avoids GitHub Actions queue congestion at ':00' which causes dropped or delayed cron runs
    - cron: '17,47 * * * *'
  push:
    branches:
      - main
    paths-ignore:
      - 'data.json'
      - 'README.md'
      - 'DATA_PIPELINE.md'
      - '.gitignore'
      - 'favicon.*'
      - 'apple-touch-icon.png'
  workflow_dispatch:
  repository_dispatch:
    types: [hourly-update, external-ping]

concurrency:
  group: update-ai-trends
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Feed ETag & Conditional State
        uses: actions/cache@v4
        with:
          path: .feed_cache.json
          key: feed-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            feed-cache-${{ runner.os }}-

      - name: Install Dependencies
        run: pip install feedparser google-genai

      - name: Run Backend Tracker
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python tracker.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Test Suite
        run: npm test

      - name: Check Editorial Delta and Commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ ! -f data.json ]; then
            echo "data.json not found, skipping commit."
            exit 0
          fi

          # Check if data.json contains meaningful editorial delta vs HEAD
          SHOULD_COMMIT=$(python3 -c '
          import json, subprocess, sys

          try:
              with open("data.json") as f:
                  new_data = json.load(f)
          except Exception:
              sys.exit(0)

          try:
              old_raw = subprocess.check_output(["git", "show", "HEAD:data.json"], stderr=subprocess.DEVNULL).decode("utf-8")
              old_data = json.loads(old_raw)
          except Exception:
              print("YES")
              sys.exit(0)

          def get_sig(d):
              stories = d.get("top_stories", [])
              return [(s.get("id") or s.get("title"), s.get("pulse_score"), s.get("article_type")) for s in stories]

          if get_sig(new_data) != get_sig(old_data):
              print("YES")
          else:
              print("NO")
          ')

          if [ "$SHOULD_COMMIT" = "YES" ]; then
            git add data.json
            if ! git diff --staged --quiet; then
              git commit -m "Auto-update AI Trends [editorial delta]"
              git pull --rebase origin main
              git push
            else
              echo "No staged git changes."
            fi
          else
            echo "Skipping commit: data.json only contained timestamp updates with no editorial delta."
          fi
